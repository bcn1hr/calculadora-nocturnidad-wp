<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Nocturnidad</title>
    <style>
        body {
            font-family: Lato, sans-serif;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th,
        td {
            padding: 10px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .container {
            margin-bottom: 20px;
        }

        .area-selector {
            margin-bottom: 20px;
        }

        .area-selector label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .area-selector select {
            padding: 8px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 200px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="area-selector">
            <label for="areaSelect">Área:</label>
            <select id="areaSelect" onchange="updateShifts()">
                <option value="NONE">Selecciona Área</option>
                <option value="OB">OUTBOUND</option>
                <option value="IB">RSP / INBOUND / ICQA</option>
            </select>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Turno</th>
                    <th>¿Es fin de semana?</th>
                </tr>
            </thead>
            <tbody id="shiftTable">
                <!-- Rows are generated dynamically -->
            </tbody>
        </table>
    </div>
    <div style="margin-bottom: 20px;">
    <label>
        <input type="checkbox" id="isNextMonthWeekend">
        ¿El día 1 del próximo mes es fin de semana?
    </label>
    </div>

    <button onclick="calculate()">Calcular</button>
    <h2>Horas nocturnas: <span id="totalNightHours">0</span> horas</h2>
    <h2>Weekend premium: <span id="totalWeekendPremium">0</span> horas</h2>

    <script>

        // Valores de nocturnidad por cada shift
        const areaShifts = {
            OB: {
                "e": 0,
                "l": 1.33,
                "ln": 6,
                "ln1": 6.5,
                "n7.75": 6.58,
                "n5.25": 5.25,
                "n7.2": 6.58,
                "n8": 6.5,
                "n8.33": 6.5,
                "n8.5": 7.33
            },
            IB: {
                "e": 0,
                "l": 0.92,
                "ln": 6,
                "ln1": 6.5,
                "n7.75": 7,
                "n5.25": 5.25,
                "n7.2": 7,
                "n8": 6.5,
                "n8.33": 6.5,
                "n8.5": 7.75
            }
        };

        // Valores de WP por cada shift en función de si el día de inicio o el siguiente o ambos son en fin de semana
        const weekendPremiums = {
            OB: {
                "e": { current: 0, next: 0 },
                "l": { current: 0.5, next: 0 },
                "ln": { current: 4, next: 1 },
                "ln1": { current: 2.5, next: 1.25 },
                "n7.75": { current: 3, next: 1.5 },
                "n5.25": { current: 2, next: 1 },
                "n7.2": { current: 3, next: 1.5 },
                "n8": { current: 3.5, next: 1.75 },
                "n8.33": { current: 3.5, next: 1.75 },
                "n8.5": { current: 4, next: 2 }
            },
            IB: {
                "e": { current: 0, next: 0 },
                "l": { current: 0.5, next: 0.25 },
                "ln": { current: 2, next: 1 },
                "ln1": { current: 2.5, next: 1.25 },
                "n7.75": { current: 3, next: 1.5 },
                "n5.25": { current: 2, next: 1 },
                "n7.2": { current: 3, next: 1.5 },
                "n8": { current: 3.5, next: 1.75 },
                "n8.33": { current: 3.5, next: 1.75 },
                "n8.5": { current: 4, next: 2 }
            }
        };

        let currentShifts = {};
        let currentPremiums = {};

        function updateShifts() {
            const selectedArea = document.getElementById("areaSelect").value;

            if (selectedArea === "NONE") {
                currentShifts = {};
                currentPremiums = {};
                return;
            }

            currentShifts = areaShifts[selectedArea];
            currentPremiums = weekendPremiums[selectedArea];

            for (let day = 1; day <= 31; day++) {
                const select = document.getElementById(`shiftDay${day}`);
                select.innerHTML = '<option value="">No trabajado</option>';

                for (const shiftName in currentShifts) {
                    const option = document.createElement("option");
                    option.value = shiftName;
                    option.textContent = shiftName;
                    select.appendChild(option);
                }
            }
        }

        const shiftTable = document.getElementById("shiftTable");
        for (let day = 1; day <= 31; day++) {
            const row = document.createElement("tr");

            const dateCell = document.createElement("td");
            dateCell.textContent = `Día ${day}`;
            row.appendChild(dateCell);

            const shiftCell = document.createElement("td");
            const select = document.createElement("select");
            select.id = `shiftDay${day}`;
            const defaultOption = document.createElement("option");
            defaultOption.value = "";
            defaultOption.textContent = "No trabajado";
            select.appendChild(defaultOption);
            shiftCell.appendChild(select);
            row.appendChild(shiftCell);

            const weekendCell = document.createElement("td");
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.id = `weekendDay${day}`;
            weekendCell.appendChild(checkbox);
            row.appendChild(weekendCell);

            shiftTable.appendChild(row);
        }

        function calculate() {
            let totalNightHours = 0;
            let totalWeekendPremium = 0;
            const isDay32Weekend = document.getElementById("isNextMonthWeekend").checked;
        
            for (let day = 1; day <= 31; day++) {
                const selectedShift = document.getElementById(`shiftDay${day}`).value;
                const isWeekend = document.getElementById(`weekendDay${day}`).checked;
                let isNextWeekend;
        
                if (day < 31) {
                    isNextWeekend = document.getElementById(`weekendDay${day + 1}`).checked;
                } else {
                    isNextWeekend = isDay32Weekend;
                }
        
                if (selectedShift && currentShifts[selectedShift] !== undefined) {
                    totalNightHours += currentShifts[selectedShift];
        
                    if (isWeekend) {
                        totalWeekendPremium += currentPremiums[selectedShift].current;
                    }
                    if (isNextWeekend) {
                        totalWeekendPremium += currentPremiums[selectedShift].next;
                    }
                }
            }
        
            document.getElementById("totalNightHours").textContent = totalNightHours.toFixed(2);
            document.getElementById("totalWeekendPremium").textContent = totalWeekendPremium.toFixed(2);
        }
    </script>
</body>

</html>
